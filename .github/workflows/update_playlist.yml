name: Update and Modify IPTV Playlist

on:
  schedule:
    # Esegui ogni giorno a mezzanotte UTC (puoi cambiare l'orario)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Permette di eseguire manualmente l'azione dalla UI di GitHub

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Importante: serve il token per permettere allo step successivo di fare push
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run modification script
        run: python update_list.py

      - name: Commit and Push changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: actions@github.com
          message: 'Auto-update modified IPTV playlist'
          add: 'netplus_modified.mpd' # Il file che vuoi aggiungere/aggiornare
